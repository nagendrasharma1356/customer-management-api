spring.application.name=customer-management-api
server.port=8080

# --- Database: H2 (in-memory, data is lost on restart) ---
spring.datasource.url=jdbc:h2:mem:customerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# To keep data between restarts, use a file database instead:
# spring.datasource.url=jdbc:h2:file:./data/customerdb
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 web console: http://localhost:8080/h2-console (JDBC URL = value above, user sa, empty password)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JWT (Base64 secret, min 256 bits). Replace for production! ---
jwt.secret=u2FobVR4Ofrmcd819quGxXnNlNwZRIYNjEbdkxAqtpzl7trG1PJXDYYQ4fnETsgQ
jwt.expiration-ms=3600000

# --- Default admin created on first start ---
app.admin.username=admin
app.admin.password=admin123
